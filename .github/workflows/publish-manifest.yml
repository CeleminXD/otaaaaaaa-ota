name: Publish OTA manifest
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: ota-manifest-${{ github.repository }}
  cancel-in-progress: false
jobs:
  update-manifest:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Update manifest from release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be MAJOR.MINOR.PATCH, optionally prefixed with v."
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets")"
          versioned_asset="otaaaaaaa-v${version}.bin"
          if jq -e --arg name "$versioned_asset" '.[] | select(.name == $name)' <<< "$assets" >/dev/null; then
            asset_name="$versioned_asset"
          elif jq -e '.[] | select(.name == "otaaaaaaa.bin")' <<< "$assets" >/dev/null; then
            asset_name="otaaaaaaa.bin"
          else
            echo "::error::Release must include $versioned_asset or otaaaaaaa.bin."
            exit 1
          fi
          asset_url="$(jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .browser_download_url' <<< "$assets")"
          if [[ "$asset_url" != https://github.com/*/releases/download/* || ${#asset_url} -ge 200 ]]; then
            echo "::error::Release asset URL is invalid or too long for the ESP firmware."
            exit 1
          fi
          checksum_name="${asset_name}.sha256"
          if ! jq -e --arg name "$checksum_name" '.[] | select(.name == $name)' <<< "$assets" >/dev/null; then
            echo "::error::Release must include $checksum_name generated with the firmware package."
            exit 1
          fi
          checksum_url="$(jq -r --arg name "$checksum_name" '.[] | select(.name == $name) | .browser_download_url' <<< "$assets")"
          curl --fail --location --retry 3 --silent --show-error "$asset_url" -o firmware.bin
          curl --fail --location --retry 3 --silent --show-error "$checksum_url" -o firmware.sha256
          firmware_sha256="$(sha256sum firmware.bin | cut -d ' ' -f 1)"
          expected_sha256="$(tr -d '[:space:]' < firmware.sha256)"
          if [[ ! -s firmware.bin || ! "$firmware_sha256" =~ ^[a-f0-9]{64}$ || ! "$expected_sha256" =~ ^[a-f0-9]{64}$ || "$firmware_sha256" != "$expected_sha256" ]]; then
            echo "::error::The released firmware does not match its packaged SHA-256 checksum."
            exit 1
          fi
          jq -n --arg version "$version" --arg url "$asset_url" \
            --arg model "otaaaaaaa" --arg target "esp32c6" --arg sha256 "$firmware_sha256" \
            '{version: $version, url: $url, model: $model, target: $target, sha256: $sha256}' > manifest.json
          if git diff --quiet -- manifest.json; then
            echo "Manifest already points to this release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update OTA manifest to ${version}"
          git push origin HEAD:main
